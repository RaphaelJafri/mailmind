[package]
name = "mailmind-shell"
version = "0.1.0"
description = "Tauri shell for mailmind"
authors = ["Raphael Jafri <raphaeljafri@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mailmind_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
